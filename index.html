<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kuis Suara</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="wrap">


  <!-- ========== SCREEN SETUP ========== -->
  <div id="screen-setup">
    <h1>🎤 Kuis Suara</h1>
    <p class="sub">Atur pilihan kuis sebelum memulai</p>

    <div class="card">
      <h3>📋 Pilih Set Soal</h3>

      <select id="pilihSheet" onchange="gantiSheet()">
        <option value="Uji">Uji (dari Spreadsheet)</option>
        <option value="Uji2">Uji2 (dari Spreadsheet)</option>
        <option value="lokal">Soal Lokal (Edit Manual)</option>
      </select>

      <p id="status-sheet" class="loading" style="margin-top:8px"></p>
    </div>

    <div class="card">
      <h3>🔊 Cara Soal Ditampilkan</h3>

      <div class="opsi-grup">
        <button class="opsi aktif"
          id="opsi-soal-suara"
          onclick="pilihOpsi('soal','suara')">

          🔊 Dibacakan
        </button>

        <button class="opsi"
          id="opsi-soal-teks"
          onclick="pilihOpsi('soal','teks')">

          📄 Teks Saja
        </button>
      </div>
    </div>

<div class="card">
  <h3>🎮 Mode Permainan</h3>

  <div class="opsi-grup">
    <button 
      class="opsi aktif-ungu aktif" 
      id="opsi-mode-sekali"
      onclick="pilihOpsi('mode','sekali')"
    >
      1× Sekali
    </button>

    <button 
      class="opsi" 
      id="opsi-mode-bebas"
      onclick="pilihOpsi('mode','bebas')"
    >
      🔢 Putaran
    </button>

    <button 
      class="opsi" 
      id="opsi-mode-infinity"
      onclick="pilihOpsi('mode','infinity')"
    >
      ♾ Infinity
    </button>
  </div>

  <div id="input-putaran" style="display:none; margin-top:10px;">
    <input 
      type="number" 
      id="jmlPutaran" 
      min="1" 
      value="3"
      class="input-jawab"
      placeholder="Jumlah putaran"
    >
  </div>

  <div 
    id="info-infinity" 
    class="info-box info-ungu" 
    style="display:none"
  >
    <b>Infinity Mode:</b> 
    Jika salah harus mengulang sampai benar.
  </div>
</div>
    
    <div class="card">
      <h3>🎙️ Cara Menjawab</h3>

      <div class="opsi-grup">

        <button class="opsi aktif-hijau aktif"
          id="opsi-jawab-suara"
          onclick="pilihOpsi('jawab','suara')">

          🎙️ Suara
        </button>

        <button class="opsi"
          id="opsi-jawab-ketik"
          onclick="pilihOpsi('jawab','ketik')">

          ⌨️ Ketik
        </button>

        <button class="opsi"
          id="opsi-jawab-pinyin"
          onclick="pilihOpsi('jawab','pinyin')">

          🀄 Pinyin
        </button>

      </div>

      <div id="info-pinyin"
        class="info-box info-oren"
        style="display:none">

        <b>Mode Pinyin:</b>
        Keyboard khusus dengan vokal bernada.
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-hijau" onclick="mulaiKuis()">
        ▶ Mulai Kuis
      </button>

      <button class="btn btn-abu" onclick="showEditor()">
        ✏️ Edit Soal Lokal
      </button>
    </div>
  </div>

  <!-- ========== SCREEN KUIS ========== -->
  <div id="screen-kuis" style="display:none">

    <div class="card">

      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>

      <div id="label-sheet"></div>
<div id="label-mode"></div>

<button 
  class="btn btn-ungu" 
  id="btnUlangi" 
  onclick="ulangiSoal()" 
  style="display:none"
>
  🔄 Ulangi
</button>

      <div id="nomor-soal"></div>

      <div class="soal-box" id="soal"></div>

      <div class="hasil-box" id="hasil"></div>

      <div class="skor-box" id="skor"></div>

      <div class="streak-box" id="streak"></div>

      <input type="text"
        class="input-jawab"
        id="inputJawab">

      <div id="keyboard-pinyin" style="display:none">

  <div id="kb-display" class="kb-display">&#8203;</div>

  <div class="kb-section">
    <div class="kb-label">Nada</div>

    <button class="kb-btn nada" id="nada-0" onclick="pilihNada(0)">◌</button>
    <button class="kb-btn nada" id="nada-1" onclick="pilihNada(1)">¯</button>
    <button class="kb-btn nada" id="nada-2" onclick="pilihNada(2)">´</button>
    <button class="kb-btn nada" id="nada-3" onclick="pilihNada(3)">ˇ</button>
    <button class="kb-btn nada" id="nada-4" onclick="pilihNada(4)">`</button>
  </div>

  <div class="kb-section">
    <div class="kb-label">Vokal</div>
    <div id="kb-vokal"></div>
  </div>

  <div class="kb-section">
    <div class="kb-label">Konsonan</div>
    <div id="kb-konsonan"></div>
  </div>

  <div class="kb-section">
    <div class="kb-label">Akhiran</div>
    <div id="kb-khusus"></div>
  </div>

  <div class="kb-section">
    <button class="kb-btn spesial" onclick="kbSpasi()">Spasi</button>
    <button class="kb-btn spesial" onclick="kbHapus()">⌫ Hapus</button>
    <button class="kb-btn spesial kb-submit">✅ Submit</button>
  </div>

</div>

<div class="btn-row">
  <button class="btn btn-biru" id="btnJawab">🎤 Jawab</button>

  <button class="btn btn-abu" id="btnUlangi" onclick="ulangiSoal()">
    🔄 Ulangi
  </button>

  <button class="btn btn-kuning" id="btnSkip" onclick="skipSoal()">
    ⏭ Skip
  </button>

  <button class="btn btn-merah" onclick="selesai()">
    ⏹ Selesai
  </button>
</div>

      </div>
    </div>
  </div>

  <!-- ========== SCREEN EDITOR ========== -->
  <div id="screen-editor" style="display:none">

    <div class="card">

      <h3>✏️ Edit Soal Lokal</h3>

      <textarea id="inputSoal" rows="12"></textarea>

      <div class="btn-row">

        <button class="btn btn-hijau"
          onclick="simpanSoalLokal()">

          💾 Simpan
        </button>

        <button class="btn btn-abu"
          onclick="showSetup()">

          ← Kembali
        </button>

      </div>

      <p id="pesan-simpan"></p>

    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/editor.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>

</body>
</html>
